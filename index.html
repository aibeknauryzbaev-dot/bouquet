<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жылы тілектер шоғы</title><style>
*{box-sizing:border-box}body{margin:0;color:#244f43;background:radial-gradient(ellipse at 25% 40%,#e4efdf,transparent 60%),#fcf7ed;font-family:Arial,sans-serif}header{padding:24px 5vw;display:flex;justify-content:space-between;align-items:center;gap:18px}small{letter-spacing:3px;color:#718772}h1{font:clamp(30px,4vw,56px) Georgia;margin:12px 0}button{font:inherit;cursor:pointer;border:1px solid #c6d4bf;border-radius:30px;padding:14px 22px;color:#315343;background:#ffffffb0;touch-action:manipulation}button:focus-visible{outline:4px solid #bc923e;outline-offset:4px}nav{display:flex;gap:10px}main{max-width:1400px;margin:auto;padding:0 4vw 25px;display:grid;grid-template-columns:1.2fr 1fr;gap:4%;align-items:center}.garden{position:relative}.bouquet{width:100%;max-height:73vh;overflow:visible;filter:drop-shadow(0 14px 16px #36523920)}.stem{stroke-dasharray:750;stroke-dashoffset:750;animation:grow 1.5s ease-out forwards;animation-delay:var(--d)}.bloom{transform-box:fill-box;transform-origin:center;animation:bloom 1.2s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--d)}.selected{filter:drop-shadow(0 0 12px #e9b23b)}.wrap{animation:appear 1.2s both}.tap{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);height:94px;width:94px;border-radius:50%;padding:8px;background:linear-gradient(135deg,#fff2bc,#dfb758);border:2px solid #fff2cb;box-shadow:0 8px 25px #7d613936;font-weight:bold;color:#634b21}.hint{text-align:center;color:#68806a;font-size:17px}.panel{border:1px solid white;border-radius:34px;padding:clamp(24px,4vw,55px);background:#ffffffb5;box-shadow:0 24px 80px #46653d12}.label{font-size:14px;letter-spacing:2px;color:#9b7947}.wish{font:clamp(28px,3.4vw,48px)/1.25 Georgia;min-height:3.7em;margin:24px 0}.sub{font-size:18px;line-height:1.5;color:#6c816e}.mini{height:80px;margin-top:15px}.mini svg{height:80px;width:80px;overflow:visible}.dots{display:flex;gap:9px;margin:30px 0 15px}.dots i{height:9px;flex:1;border-radius:8px;background:#dfe7d9;transition:background .3s}.dots i.on{background:#ba9453}.count{font-size:16px;color:#6c816e}.final{font-size:21px;color:#977135;line-height:1.4;min-height:30px}.enter{animation:appear .65s both}.spark{position:absolute;left:50%;top:50%;color:#d8ac50;font-size:24px;pointer-events:none;animation:spark 1.2s forwards}footer{text-align:center;padding:10px 20px 25px;font-size:13px;letter-spacing:3px;color:#7c8e78}@keyframes grow{to{stroke-dashoffset:0}}@keyframes bloom{from{opacity:0;transform:translateY(50px) scale(.01) rotate(-30deg)}to{opacity:1;transform:none}}@keyframes appear{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes spark{to{transform:translate(var(--x),var(--y));opacity:0}}@media(max-width:760px){header{align-items:flex-start;flex-direction:column;padding:20px}main{grid-template-columns:1fr;gap:20px}.bouquet{max-height:52vh}.tap{width:78px;height:78px;font-size:14px}.wish{min-height:0}.panel{padding:26px}nav button{font-size:14px}.hint{font-size:15px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.stem{stroke-dashoffset:0}}
</style><body><header><div><small>ПСИХОЛОГИЯЛЫҚ АХУАЛ</small><h1>Жылы тілектер шоғы</h1></div><nav><button id="reset">Қайта бастау</button><button id="full">Толық экран</button></nav></header><main><section class="garden"><svg class="bouquet" viewBox="0 0 600 650" role="img" aria-label="Кезекпен ашылатын он гүлден тұратын гүл шоғы"><defs><radialGradient id="gold"><stop stop-color="#fff5b2"/><stop offset="1" stop-color="#d1a143"/></radialGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f3f3df"/><stop offset="1" stop-color="#abc5a6"/></linearGradient></defs><ellipse cx="300" cy="620" rx="120" ry="14" fill="#426835" opacity=".08"/><g id="stems"></g><g class="wrap"><path d="M128 367Q195 380 300 420Q402 380 472 367L342 596Q300 612 258 596Z" fill="url(#paper)" stroke="#aac29e" stroke-width="2"/><path d="M128 367L300 560L258 596Z" fill="#ffffee" opacity=".7"/><path d="M472 367L300 560L342 596Z" fill="#afc6a7"/><path d="M256 548Q300 560 345 548L340 570Q300 580 260 570Z" fill="#d5ad63"/><path d="M300 558C217 484 217 579 300 558C383 485 383 580 300 558M295 560L272 613M305 560L335 612" fill="none" stroke="#d5ad63" stroke-width="13" stroke-linecap="round"/></g><g id="flowers"></g></svg><button id="next" class="tap" aria-label="Келесі жылы тілекті ашу">Тілек<br>ашу</button><p class="hint">Гүл шоғының ортасын басып, жылы тілек аш!</p></section><section class="panel"><div class="label" id="label">10 ГҮЛ · 10 ЖЫЛЫ ТІЛЕК</div><div id="content" aria-live="polite" aria-atomic="true"><div class="mini" id="mini"></div><h2 id="wish" class="wish">Жақсы күн жылы тілектен басталады.</h2><p class="sub" id="sub">Әр гүлде саған арналған бір тілек бар.</p></div><div class="dots" id="dots" aria-hidden="true"></div><div class="count" id="count">Ашылған тілектер: 0 / 10</div><p class="final" id="final" aria-live="polite"></p></section></main><footer>МЕЙІРІМ СЫЙЛА · БІРГЕ ГҮЛДЕНЕЙІК</footer><script>
const wishes=['Күнің қуанышқа толы болсын!','Сабағың сәтті өтсін!','Білімге қызығушылығың арта берсін!','Бүгін өзіңе сенімді бол!','Көңіл күйің көтеріңкі болсын!','Достарыңа мейірімділік сыйла!','Тапсырмаларды сәтті орында!','Жаңа білімді қуана қабылда!','Табиғатқа қамқор бол!','Армандарың орындалсын!'];
const positions=[[300,109],[196,160],[401,163],[125,253],[299,237],[474,251],[203,323],[395,324],[274,402],[362,412]],colors=['#c2aaeb','#f2bdad','#a9d5e4','#ecd395','#edafc5','#bdd8a0','#bca7da','#efb594','#a7d4c2','#efc2c5'];const $=id=>document.getElementById(id);let current=0;
// Build separate vector petals so flowers really unfold, not just a flat picture.
function flower(color){let s='';for(let n=0;n<10;n++)s+=`<ellipse cx="0" cy="-29" rx="17" ry="31" transform="rotate(${n*36})" fill="${color}" stroke="white" stroke-opacity=".4" stroke-width="1.5"/>`;return s+'<circle r="19" fill="url(#gold)"/><circle cx="-5" cy="-6" r="7" fill="white" opacity=".25"/>';}
function build(){$('stems').innerHTML=positions.map(([x,y],i)=>`<path class="stem" style="--d:${i*.1}s" d="M300 568Q${x} 412 ${x} ${y}" fill="none" stroke="#729b72" stroke-width="6"/><path class="bloom" style="--d:${i*.1}s" d="M${x} ${y+100}q-55-10-40-60q44 3 40 60q48-15 49-58q-49 3-49 58" fill="#8db58a"/>`).join('');$('flowers').innerHTML=positions.map(([x,y],i)=>`<g transform="translate(${x} ${y})"><g id="f${i}" class="bloom" style="--d:${.5+i*.16}s">${flower(colors[i])}</g></g>`).join('');$('dots').innerHTML=wishes.map(()=>'<i></i>').join('');}
// Advance once per click; the final click offers a complete restart.
function next(){if(current===10){reset();return}let i=current++;$('f'+i).classList.add('selected');$('mini').innerHTML=`<svg viewBox="-70 -70 140 140" aria-hidden="true">${flower(colors[i])}</svg>`;$('wish').textContent=wishes[i];$('sub').textContent='Тілекті дауыстап оқып, достарыңа сыйла.';$('label').textContent=`${current}-ЖЫЛЫ ТІЛЕК`;$('count').textContent=`Ашылған тілектер: ${current} / 10`;$('dots').children[i].classList.add('on');$('content').classList.remove('enter');void $('content').offsetWidth;$('content').classList.add('enter');for(let k=0;k<12;k++){let s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.setProperty('--x',Math.cos(k*Math.PI/6)*170+'px');s.style.setProperty('--y',Math.sin(k*Math.PI/6)*160+'px');document.querySelector('.garden').append(s);setTimeout(()=>s.remove(),1300)}if(current===10){$('final').textContent='Бүгінгі сабағымыз сәтті өтсін!';$('next').innerHTML='Қайта<br>бастау';$('next').setAttribute('aria-label','Қайта бастау');}}
function reset(){current=0;build();$('mini').innerHTML='';$('wish').textContent='Жақсы күн жылы тілектен басталады.';$('sub').textContent='Әр гүлде саған арналған бір тілек бар.';$('label').textContent='10 ГҮЛ · 10 ЖЫЛЫ ТІЛЕК';$('count').textContent='Ашылған тілектер: 0 / 10';$('final').textContent='';$('next').innerHTML='Тілек<br>ашу';$('next').setAttribute('aria-label','Келесі жылы тілекті ашу');}
$('next').onclick=next;$('reset').onclick=reset;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('full').textContent='Толық экран қолжетімсіз';}catch(e){$('full').textContent='Толық экран қолжетімсіз';}};build();
</script></body></html>
